<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link rel="stylesheet" href="./tmp/figma-plugin-ds.css"><!-- Figma Plugin DS Styles -->
  <link rel="stylesheet" href="./tmp/styles.css"> <!-- Your Styles -->
</head>

<body>
  <section>
    <!-- <div class="section-title">Inputs</div> -->
    <div class="container">
      <label for="maxWidth" class="label">Max width (px)</label>
      <input id="maxWidth" type="number" class="input__field" value="1366">

      <label for="columns" class="label">Columns</label>
      <input id="columns" type="number" class="input__field" value="12">

      <label for="margin" class="label">Margin (px)</label>
      <input id="margin" type="number" class="input__field" value="32">
      <label for="gutter" class="label">Gutter (px)</label>
      <input id="gutter" type="number" class="input__field" value="24">

    </div>
  </section>
  <hr> 
  <section>
    <!-- <h3 class="section-title">Results</h3> -->
    <div class="container">
      <label for="calculatedWidth" class="label">Calculated width</label>
      <div id="calculatedWidth" class=" result-value">--</div>

      <label for="columnWidth" class="label">Column width</label>
      <div id="columnWidth" class=" result-value">--</div>
    </div>
  </section>
  <hr>
  <section>
     <div class="container ">
      <label for="breakpoint" class="label">Breakpoint/Group</label>
      <input id="breakpoint" type="text" class="input__field" value="grid/xl">
      </div>
    <!-- <div class="section-title">Generate Variables</div> -->
    <div class="checkbox">
      <input id="generateVariablesCheckbox" type="checkbox" class="checkbox__box">
      <label for="generateVariablesCheckbox" class="checkbox__label">Generate/update variables</label>
    </div>
    <div id="variable-options-container" class="container hidden">
      <label for="collectionSelect" class="label">Collection</label>
      <select id="collectionSelect" class="select-menu">
        <option value="" disabled selected>Select collection</option>
      </select>

    </div>
        <div class="checkbox">
          <input id="generateFrameCheckbox" type="checkbox" class="checkbox__box">
          <label for="generateFrameCheckbox" class="checkbox__label">Generate frame</label>
        </div>
  </section>
  <footer>
    <button id="generateButton" class="button button--primary" >Generate</button>
  </footer>
  <script src="./tmp/scripts.js"></script>
</body>

</html>
